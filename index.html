<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafafa; --panel:#ffffff; --sidebar:#f4f4f6;
    --ink:#202124; --muted:#8b8f98;
    --accent:#5468e8; --accent-soft:#eef0fd; --border:#e4e4e7; --line:#a9adb8;
    --danger:#b42318; --danger-bg:#fef3f2; --danger-border:#fecdca;
    --ok:#067647; --ok-bg:#ecfdf3; --ok-border:#abefc6;
    --grid:#d2d2d8;
    --n1:#e5484d; --n2:#f76b15; --n3:#e0b700; --n4:#30a46c; --n5:#00a2c7; --n6:#8e4ec6;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
    --dock-shadow:0 4px 18px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1e1e20; --panel:#262629; --sidebar:#1a1a1c;
      --ink:#dcddde; --muted:#888a90;
      --accent:#7b8cf5; --accent-soft:#2b2f45; --border:#36363a; --line:#6a6d78;
      --danger:#fda29b; --danger-bg:#2b1512; --danger-border:#5b2320;
      --ok:#75e0a7; --ok-bg:#0d2a1c; --ok-border:#1f5138;
      --grid:#333338;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
      --dock-shadow:0 4px 18px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%; margin:0; overflow:hidden}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button{font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--border);
         background:var(--panel); color:var(--ink); padding:6px 11px; font-weight:500;
         transition:background .13s, border-color .13s}
  button:hover:not(:disabled){background:var(--accent-soft); border-color:var(--accent)}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary:hover:not(:disabled){filter:brightness(1.08)}
  button:disabled{opacity:.45; cursor:default}

  /* ================= sign-in gate ================= */
  .gate{position:fixed; inset:0; z-index:300; display:grid; place-items:center;
        background:var(--bg); padding:24px}
  .gate-card{background:var(--panel); border:1px solid var(--border); border-radius:16px;
             box-shadow:var(--shadow); padding:32px 30px; max-width:400px; width:100%; text-align:center}
  .gate-card .logo{width:44px; height:44px; border-radius:13px; background:var(--accent);
                   display:grid; place-items:center; color:#fff; font-weight:700;
                   font-size:16px; margin:0 auto 16px}
  .gate-card h2{margin:0 0 6px; font-size:18px; font-weight:600; letter-spacing:-.02em}
  .gate-card p{margin:0 0 22px; font-size:13px; color:var(--muted)}
  #gsiButton{display:flex; justify-content:center; min-height:44px}
  .gate-msg{margin-top:18px; font-size:12.5px; text-align:left; border-radius:9px;
            padding:10px 12px; color:var(--danger); background:var(--danger-bg);
            border:1px solid var(--danger-border)}

  /* ================= shell ================= */
  .shell{display:grid; grid-template-columns:248px minmax(0,1fr); height:100vh}

  /* ================= sidebar ================= */
  .sidebar{background:var(--sidebar); border-right:1px solid var(--border);
           display:flex; flex-direction:column; min-height:0}
  .side-head{padding:16px 14px 12px; border-bottom:1px solid var(--border)}
  .board-name{display:flex; align-items:center; gap:8px}
  .board-name .logo{width:26px; height:26px; border-radius:8px; background:var(--accent);
                    display:grid; place-items:center; color:#fff; font-weight:700; font-size:12px;
                    flex:none}
  #clientName{
    font:inherit; font-size:15px; font-weight:600; letter-spacing:-.01em;
    color:var(--ink); background:transparent; border:1px solid transparent;
    border-radius:6px; padding:2px 5px; width:100%; min-width:0;
  }
  #clientName:hover{border-color:var(--border)}
  #clientName:focus{outline:none; border-color:var(--accent); background:var(--panel)}
  .side-head .sub{font-size:11px; color:var(--muted); margin:5px 0 0 34px;
                  letter-spacing:.06em; text-transform:uppercase; font-weight:600}

  .tabs{flex:1; overflow-y:auto; padding:10px 8px; display:flex; flex-direction:column; gap:2px}
  .tab{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    padding:8px 10px; border-radius:8px; border:1px solid transparent;
    background:transparent; color:var(--muted); font-size:13px; font-weight:500;
  }
  .tab:hover{background:var(--panel); color:var(--ink); border-color:var(--border)}
  .tab.active{background:var(--accent-soft); color:var(--accent); border-color:transparent; font-weight:600}
  /* Obsidian tags the file type on the right of each row in muted small caps. */
  .tab .n{margin-left:auto; font-size:9.5px; font-weight:600; color:var(--muted);
          letter-spacing:.09em; text-transform:uppercase; flex:none}
  .tab.active .n{color:var(--accent)}

  .side-foot{border-top:1px solid var(--border); padding:10px 12px;
             display:flex; align-items:center; gap:9px}
  .side-foot img{width:28px; height:28px; border-radius:50%; border:1px solid var(--border);
                 background:var(--accent-soft); object-fit:cover; flex:none}
  .who{min-width:0; flex:1}
  .who b{display:block; font-size:12.5px; font-weight:600; overflow:hidden;
         text-overflow:ellipsis; white-space:nowrap}
  .who span{display:block; font-size:11px; color:var(--muted); overflow:hidden;
            text-overflow:ellipsis; white-space:nowrap}
  .icon-btn{padding:5px 8px; font-size:12px}

  /* ================= main ================= */
  .main{display:flex; flex-direction:column; min-width:0; min-height:0}
  .toolbar{
    display:flex; align-items:center; gap:8px; padding:9px 14px;
    background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; flex:none;
  }
  .toolbar h2{margin:0; font-size:14px; font-weight:600; letter-spacing:-.01em}
  .tool-sep{width:1px; height:20px; background:var(--border); margin:0 2px}
  .zoom-label{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;
              min-width:44px; text-align:center}
  .save-state{margin-left:auto; font-size:12px; color:var(--muted)}
  .save-state.dirty{color:var(--accent)}
  .save-state.bad{color:var(--danger)}
  select{font:inherit; font-size:13px; font-weight:500; color:var(--ink); background:var(--panel);
         border:1px solid var(--border); border-radius:8px; padding:6px 9px; max-width:210px}

  /* ================= canvas ================= */
  .viewport{
    position:relative; flex:1; min-height:0; overflow:hidden;
    background-color:var(--bg);
    background-image:radial-gradient(var(--grid) 1.1px, transparent 1.1px);
    background-size:22px 22px;
    cursor:default; touch-action:none;
  }
  .viewport.panning{cursor:grabbing}
  .viewport.connecting{cursor:crosshair}
  .world{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform}
  .edges{position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible;
         pointer-events:none}
  .edges path.hit{stroke:transparent; stroke-width:16; fill:none; pointer-events:stroke; cursor:pointer}
  .edges path.wire{stroke:var(--line); stroke-width:2; fill:none; pointer-events:none}
  .edges g.sel path.wire{stroke:var(--accent); stroke-width:2.6}

  /* ---------- groups ---------- */
  /* The box itself ignores the pointer so you can still pan and click cards
     through it; only the label and the resize corner are grabbable. */
  .group{
    position:absolute; border:2px solid var(--border); border-radius:12px;
    background:rgba(120,120,140,.045); pointer-events:none;
  }
  .group.sel{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .group .glabel{
    position:absolute; left:-2px; top:-25px; max-width:100%;
    font-size:12px; font-weight:500; color:var(--muted); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; padding:2px 7px; border-radius:6px;
    pointer-events:auto; cursor:grab; user-select:none;
  }
  .group .glabel:hover{background:var(--panel); color:var(--ink)}
  .group.sel .glabel{color:var(--accent)}
  .group .glabel input{
    font:inherit; font-size:12px; color:var(--ink); background:var(--panel);
    border:1px solid var(--accent); border-radius:5px; padding:1px 5px; outline:none;
  }
  .group .ggrip{
    position:absolute; right:-3px; bottom:-3px; width:18px; height:18px;
    cursor:nwse-resize; pointer-events:auto;
  }
  .group[data-color="1"]{border-color:var(--n1)}
  .group[data-color="2"]{border-color:var(--n2)}
  .group[data-color="3"]{border-color:var(--n3)}
  .group[data-color="4"]{border-color:var(--n4)}
  .group[data-color="5"]{border-color:var(--n5)}
  .group[data-color="6"]{border-color:var(--n6)}

  .node{
    position:absolute; background:var(--panel); border:1px solid var(--border);
    border-radius:8px; box-shadow:var(--shadow); display:flex; flex-direction:column;
    overflow:hidden; user-select:none;
  }
  .node img.media{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none}
  .node.sel{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow)}
  .node .body{
    flex:1; padding:10px 12px; font-size:13px; line-height:1.5;
    white-space:pre-wrap; overflow:hidden; word-break:break-word; cursor:grab;
  }
  .node.editing .body{cursor:text}
  .node textarea{
    flex:1; width:100%; border:none; outline:none; resize:none; padding:10px 12px;
    font:inherit; font-size:13px; line-height:1.5; background:transparent; color:inherit;
  }
  .node .grip{
    position:absolute; right:0; bottom:0; width:15px; height:15px; cursor:nwse-resize;
    background:linear-gradient(135deg, transparent 48%, var(--border) 48%, var(--border) 72%, transparent 72%);
  }
  .node .anchor{
    position:absolute; width:11px; height:11px; border-radius:50%;
    background:var(--panel); border:2px solid var(--accent); opacity:0;
    transition:opacity .12s; cursor:crosshair; z-index:3;
  }
  .node:hover .anchor, .node.sel .anchor{opacity:1}
  .node .anchor:hover{transform:scale(1.35)}
  .anchor.top{left:50%; top:-6px; margin-left:-5.5px}
  .anchor.bottom{left:50%; bottom:-6px; margin-left:-5.5px}
  .anchor.left{top:50%; left:-6px; margin-top:-5.5px}
  .anchor.right{top:50%; right:-6px; margin-top:-5.5px}

  .node[data-color="1"]{border-color:var(--n1)}
  .node[data-color="2"]{border-color:var(--n2)}
  .node[data-color="3"]{border-color:var(--n3)}
  .node[data-color="4"]{border-color:var(--n4)}
  .node[data-color="5"]{border-color:var(--n5)}
  .node[data-color="6"]{border-color:var(--n6)}

  /* rubber-band selection rectangle */
  .marquee{
    position:absolute; z-index:60; pointer-events:none;
    border:1.5px solid var(--accent); border-radius:3px;
    background:rgba(84,104,232,.10);
  }

  /* floating toolbar for the current selection */
  .palette{
    position:absolute; z-index:40; display:flex; align-items:center; gap:4px; padding:6px;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow);
  }
  .palette .tool{
    width:28px; height:26px; padding:0; display:grid; place-items:center;
    background:transparent; border:1px solid transparent; border-radius:7px; color:var(--muted);
  }
  .palette .tool:hover{background:var(--accent-soft); border-color:transparent; color:var(--accent)}
  .palette .tool svg{width:16px; height:16px; fill:none; stroke:currentColor;
                     stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  .pal-sep{width:1px; height:18px; background:var(--border); margin:0 3px; flex:none}
  .swatch{width:19px; height:19px; border-radius:50%; border:2px solid var(--border);
          padding:0; background:var(--panel)}
  .swatch:hover{transform:scale(1.12)}
  .swatch[data-c="0"]{background:var(--muted)}
  .swatch[data-c="1"]{background:var(--n1)}
  .swatch[data-c="2"]{background:var(--n2)}
  .swatch[data-c="3"]{background:var(--n3)}
  .swatch[data-c="4"]{background:var(--n4)}
  .swatch[data-c="5"]{background:var(--n5)}
  .swatch[data-c="6"]{background:var(--n6)}

  /* Obsidian's floating add-bar, centred at the bottom of the canvas. */
  .dock{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    display:flex; align-items:center; gap:2px; padding:5px; z-index:50;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--dock-shadow);
  }
  .dock button{
    width:40px; height:34px; padding:0; display:grid; place-items:center;
    background:transparent; border:1px solid transparent; border-radius:8px;
    color:var(--muted);
  }
  .dock button:hover{background:var(--accent-soft); border-color:transparent; color:var(--accent)}
  .dock svg{width:19px; height:19px; display:block;
            fill:none; stroke:currentColor; stroke-width:1.7;
            stroke-linecap:round; stroke-linejoin:round}

  .hint{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; color:var(--muted); font-size:13.5px; pointer-events:none;
    line-height:1.9;
  }
  .hint kbd{font:inherit; font-size:11.5px; font-weight:600; background:var(--panel);
            border:1px solid var(--border); border-bottom-width:2px; border-radius:5px;
            padding:1px 6px; color:var(--ink)}

  /* clear of the dock, which sits at bottom:22px */
  .toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%); z-index:200;
         font-size:13px; font-weight:500; border-radius:10px; padding:10px 16px;
         box-shadow:var(--shadow); color:var(--ok); background:var(--ok-bg);
         border:1px solid var(--ok-border)}
  .toast.bad{color:var(--danger); background:var(--danger-bg); border-color:var(--danger-border)}
</style>
</head>
<body>

<!-- ============ sign-in gate ============ -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="logo">SB</div>
    <h2>Strategy Board</h2>
    <p>Sign in with your Google account to open your boards.</p>
    <div id="gsiButton"></div>
    <div class="gate-msg" id="gateMsg" hidden></div>
  </div>
</div>

<!-- ============ app ============ -->
<div class="shell" id="shell" hidden>

  <aside class="sidebar">
    <div class="side-head">
      <div class="board-name">
        <div class="logo">SB</div>
        <input id="clientName" value="XYZ" spellcheck="false" aria-label="Client name">
      </div>
      <div class="sub">Strategy Board</div>
    </div>

    <nav class="tabs" id="tabs"></nav>

    <div class="side-foot">
      <img id="userPic" alt="">
      <div class="who">
        <b id="userName"></b>
        <span id="userMail"></span>
      </div>
      <button class="icon-btn" id="btnSignOut" title="Sign out">Exit</button>
    </div>
  </aside>

  <div class="main">
    <div class="toolbar">
      <h2 id="tabTitle">Product Architecture</h2>
      <div class="tool-sep"></div>
      <button id="btnZoomOut" title="Zoom out">−</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button id="btnZoomIn" title="Zoom in">+</button>
      <button id="btnFit" title="Zoom to fit">Fit</button>
      <div class="tool-sep"></div>
      <select id="boardPicker" title="Your boards"></select>
      <button id="btnNewBoard">New board</button>
      <button id="btnSave" class="primary">Save</button>
      <span class="save-state" id="saveState"></span>
    </div>

    <div class="viewport" id="viewport">
      <div class="world" id="world">
        <div id="groups"></div>
        <svg class="edges" id="edges">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"></path>
            </marker>
            <marker id="arrowSel" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"></path>
            </marker>
          </defs>
        </svg>
        <div id="nodes"></div>
      </div>
      <div class="hint" id="hint" hidden></div>
      <div class="marquee" id="marquee" hidden></div>
      <div class="palette" id="palette" hidden></div>

      <div class="dock" id="dock">
        <button id="dockCard" title="Add card">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/></svg>
        </button>
        <button id="dockText" title="Add card with text">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 10h10M7 14h6"/></svg>
        </button>
        <button id="dockMedia" title="Add image from a URL">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10.5" r="1.4"/><path d="M4.5 17.5l4.5-4 3 2.5 3-2.5 4.5 4"/></svg>
        </button>
        <button id="dockGroup" title="Add group">
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2.5" stroke-dasharray="3.5 3"/><path d="M3 10h18"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================================================================
   CONFIG — all public values. No secrets belong in this file.
   =================================================================== */
const SUPABASE_URL = 'https://cskamgfvebryahkljlll.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MdkD-TxMCIwlu69seSHA3Q_A39GADsK';
const CLIENT_ID    = '1059013355751-6g50dsgm7df37htl2fdqrtlkh5hmrc0c.apps.googleusercontent.com';
const ALLOWED      = ['vijaysrinivassan@gmail.com'];
const BUILD        = 'v3.0';

const TABS = [
  'Product Architecture',
  'Market Research Frame',
  'Messaging Framework',
  'Positioning Document',
  'Growth Strategy',
  'Channel Strategy',
  'Content Strategy',
  'Document Gallery'
];

const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ===================================================================
   STATE
   =================================================================== */
const state = {
  user: null,
  boardId: null,               /* uuid of the Supabase row, null = unsaved */
  client: 'XYZ',
  tab: TABS[0],
  tabs: {},                    /* tabName -> { nodes:[], edges:[] } */
  boards: [],                  /* [{id,title,updated_at}] */
  sel: { ids: [], edge: null },   /* many cards/groups, or one edge */
  view: { x: 0, y: 0, z: 1 },
  dirty: false
};
let sb = null;
let spaceHeld = false;

function blankTabs(){
  const t = {};
  TABS.forEach(name => { t[name] = { nodes: [], edges: [] }; });
  return t;
}
const cur = () => state.tabs[state.tab] || (state.tabs[state.tab] = { nodes: [], edges: [] });
const nodeById = id => cur().nodes.find(n => n.id === id);

/* ---- selection ---- */
const isSel      = id => state.sel.ids.indexOf(id) !== -1;
const selNodes   = () => state.sel.ids.map(nodeById).filter(Boolean);
const clearSel   = () => { state.sel = { ids: [], edge: null }; };
const selectOnly = id => { state.sel = { ids: [id], edge: null }; };
function toggleSel(id){
  const i = state.sel.ids.indexOf(id);
  if (i === -1) state.sel.ids.push(id); else state.sel.ids.splice(i, 1);
  state.sel.edge = null;
}
function selectAll(){
  state.sel = { ids: cur().nodes.map(n => n.id), edge: null };
  render();
}

/* ===================================================================
   HELPERS
   =================================================================== */
let toastTimer = null;
function toast(msg, bad){
  const el = $('toast');
  el.textContent = msg;
  el.classList.toggle('bad', !!bad);
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, bad ? 6500 : 2400);
}
function gateMessage(msg){ const el = $('gateMsg'); el.textContent = msg; el.hidden = false; }
function isAllowed(email){
  if (!ALLOWED.length) return true;
  const e = String(email || '').toLowerCase().trim();
  return ALLOWED.some(r => {
    r = String(r).toLowerCase().trim();
    return r.startsWith('@') ? e.endsWith(r) : e === r;
  });
}
function markDirty(){
  state.dirty = true;
  const el = $('saveState');
  el.textContent = 'Unsaved changes';
  el.className = 'save-state dirty';
  scheduleAutosave();
}
let autosaveTimer = null;
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => { if (state.dirty && state.user) saveBoard(true); }, 2500);
}

/* ===================================================================
   GEOMETRY — Obsidian-style bezier edges
   =================================================================== */
const SIDE_DIR = { top:[0,-1], bottom:[0,1], left:[-1,0], right:[1,0] };

function anchorPoint(n, side){
  if (side === 'top')    return { x: n.x + n.width / 2, y: n.y };
  if (side === 'bottom') return { x: n.x + n.width / 2, y: n.y + n.height };
  if (side === 'left')   return { x: n.x,               y: n.y + n.height / 2 };
  return                        { x: n.x + n.width,     y: n.y + n.height / 2 };
}

/* Leave each anchor perpendicular to its side, which is what gives
   Obsidian's connections their characteristic shoulder. */
function bezier(p1, s1, p2, s2){
  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const k = Math.max(36, Math.min(dist * 0.45, 260));
  const d1 = SIDE_DIR[s1] || [1, 0];
  const d2 = SIDE_DIR[s2] || [-1, 0];
  const c1 = { x: p1.x + d1[0] * k, y: p1.y + d1[1] * k };
  const c2 = { x: p2.x + d2[0] * k, y: p2.y + d2[1] * k };
  return 'M ' + p1.x + ' ' + p1.y +
         ' C ' + c1.x + ' ' + c1.y + ', ' + c2.x + ' ' + c2.y + ', ' + p2.x + ' ' + p2.y;
}

/* Which side of `n` faces the point `p` most directly. */
function bestSide(n, p){
  const cx = n.x + n.width / 2, cy = n.y + n.height / 2;
  const dx = p.x - cx, dy = p.y - cy;
  if (Math.abs(dx) * n.height > Math.abs(dy) * n.width) return dx > 0 ? 'right' : 'left';
  return dy > 0 ? 'bottom' : 'top';
}

/* ===================================================================
   COORDINATES
   =================================================================== */
function toWorld(clientX, clientY){
  const r = $('viewport').getBoundingClientRect();
  return {
    x: (clientX - r.left - state.view.x) / state.view.z,
    y: (clientY - r.top  - state.view.y) / state.view.z
  };
}
function applyView(){
  const v = state.view;
  $('world').style.transform = 'translate(' + v.x + 'px,' + v.y + 'px) scale(' + v.z + ')';
  $('zoomLabel').textContent = Math.round(v.z * 100) + '%';
  positionPalette();
}
function zoomAt(clientX, clientY, factor){
  const r = $('viewport').getBoundingClientRect();
  const mx = clientX - r.left, my = clientY - r.top;
  const w = toWorld(clientX, clientY);
  const z = Math.max(0.15, Math.min(3.5, state.view.z * factor));
  state.view.z = z;
  state.view.x = mx - w.x * z;
  state.view.y = my - w.y * z;
  applyView();
}
function zoomToFit(){
  const ns = cur().nodes;
  const vp = $('viewport').getBoundingClientRect();
  if (!ns.length){ state.view = { x: vp.width / 2, y: vp.height / 2, z: 1 }; applyView(); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  ns.forEach(n => {
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x + n.width); y1 = Math.max(y1, n.y + n.height);
  });
  const pad = 80;
  const z = Math.max(0.15, Math.min(1.6,
    Math.min((vp.width - pad * 2) / (x1 - x0), (vp.height - pad * 2) / (y1 - y0))));
  state.view.z = z;
  state.view.x = vp.width / 2 - ((x0 + x1) / 2) * z;
  state.view.y = vp.height / 2 - ((y0 + y1) / 2) * z;
  applyView();
}

/* ===================================================================
   RENDER
   =================================================================== */
function render(){
  renderTabs();
  renderGroups();
  renderNodes();
  renderEdges();
  renderHint();
  positionPalette();
}

function renderTabs(){
  const box = $('tabs');
  box.innerHTML = '';
  TABS.forEach(name => {
    const t = state.tabs[name] || { nodes: [] };
    const b = document.createElement('button');
    b.className = 'tab' + (name === state.tab ? ' active' : '');
    const label = document.createElement('span');
    label.textContent = name;
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = (t.nodes || []).filter(x => x.type !== 'group').length;
    b.append(label, n);
    b.onclick = () => switchTab(name);
    box.append(b);
  });
  $('tabTitle').textContent = state.tab;
}

/* A card belongs to a group when its centre falls inside the group's box —
   the same containment rule Obsidian uses, so there is no membership to
   maintain: drag a card in and it is in. */
function containedNodes(g){
  return cur().nodes.filter(n => {
    if (n.type === 'group') return false;
    const cx = n.x + n.width / 2, cy = n.y + n.height / 2;
    return cx > g.x && cx < g.x + g.width && cy > g.y && cy < g.y + g.height;
  });
}

function renderGroups(){
  const box = $('groups');
  box.innerHTML = '';
  cur().nodes.filter(n => n.type === 'group').forEach(g => {
    const el = document.createElement('div');
    el.className = 'group' + (isSel(g.id) ? ' sel' : '');
    el.style.left = g.x + 'px';
    el.style.top = g.y + 'px';
    el.style.width = g.width + 'px';
    el.style.height = g.height + 'px';
    if (g.color) el.dataset.color = g.color;
    el.dataset.id = g.id;

    const label = document.createElement('div');
    label.className = 'glabel';
    label.textContent = g.label || 'Group';
    el.append(label);

    const grip = document.createElement('div');
    grip.className = 'ggrip';
    el.append(grip);

    box.append(el);
  });
}

function renameGroup(labelEl, g){
  const input = document.createElement('input');
  input.value = g.label || '';
  labelEl.textContent = '';
  labelEl.append(input);
  input.focus();
  input.select();
  const commit = () => {
    const v = input.value.trim();
    if (v !== (g.label || '')){ g.label = v || 'Group'; markDirty(); }
    render();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') input.blur();
    if (ev.key === 'Escape'){ input.value = g.label || ''; input.blur(); }
  });
}

function renderNodes(){
  const box = $('nodes');
  box.innerHTML = '';
  cur().nodes.filter(n => n.type !== 'group').forEach(n => {
    const el = document.createElement('div');
    el.className = 'node' + (isSel(n.id) ? ' sel' : '');
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.style.width = n.width + 'px';
    el.style.height = n.height + 'px';
    if (n.color) el.dataset.color = n.color;
    el.dataset.id = n.id;

    if (n.type === 'link'){
      const img = document.createElement('img');
      img.className = 'media';
      img.src = n.url || '';
      img.alt = '';
      el.append(img);
    } else {
      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = n.text || '';
      el.append(body);
    }

    ['top','right','bottom','left'].forEach(side => {
      const a = document.createElement('div');
      a.className = 'anchor ' + side;
      a.dataset.side = side;
      el.append(a);
    });

    const grip = document.createElement('div');
    grip.className = 'grip';
    el.append(grip);

    box.append(el);
  });
}

function renderEdges(){
  const svg = $('edges');
  /* keep <defs>, drop drawn groups */
  Array.from(svg.querySelectorAll('g')).forEach(g => g.remove());

  cur().edges.forEach(e => {
    const a = nodeById(e.fromNode), b = nodeById(e.toNode);
    if (!a || !b) return;
    const p1 = anchorPoint(a, e.fromSide), p2 = anchorPoint(b, e.toSide);
    const d = bezier(p1, e.fromSide, p2, e.toSide);
    const selected = state.sel.edge === e.id;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    if (selected) g.setAttribute('class', 'sel');

    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hit.setAttribute('class', 'hit');
    hit.setAttribute('d', d);
    hit.dataset.edge = e.id;

    const wire = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    wire.setAttribute('class', 'wire');
    wire.setAttribute('d', d);
    wire.setAttribute('marker-end', selected ? 'url(#arrowSel)' : 'url(#arrow)');

    g.append(hit, wire);
    svg.append(g);
  });

  if (drag && drag.kind === 'link' && drag.preview){
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'sel');
    const wire = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    wire.setAttribute('class', 'wire');
    wire.setAttribute('d', drag.preview);
    wire.setAttribute('marker-end', 'url(#arrowSel)');
    g.append(wire);
    svg.append(g);
  }
}

function renderHint(){
  const h = $('hint');
  if (cur().nodes.length){ h.hidden = true; return; }
  h.hidden = false;
  h.innerHTML =
    '<div><b>' + state.tab + '</b> is empty</div>' +
    '<div>Double-click anywhere, or use the bar below, to add a card</div>' +
    '<div>Drag a card’s edge dot to connect it to another</div>' +
    '<div>Drag across the canvas to select · <kbd>Space</kbd>+drag to pan · scroll to zoom</div>';
}

function buildPalette(){
  const p = $('palette');
  if (p.children.length) return;

  const del = document.createElement('button');
  del.className = 'tool';
  del.title = 'Delete selection';
  del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>';
  del.onclick = ev => { ev.stopPropagation(); deleteSelection(); };
  p.append(del);

  const grp = document.createElement('button');
  grp.className = 'tool';
  grp.id = 'palGroup';
  grp.title = 'Group selection';
  grp.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2.5" stroke-dasharray="3.5 3"/><path d="M3 10h18"/></svg>';
  grp.onclick = ev => { ev.stopPropagation(); groupSelection(); };
  p.append(grp);

  const sep = document.createElement('span');
  sep.className = 'pal-sep';
  p.append(sep);

  [0,1,2,3,4,5,6].forEach(c => {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.dataset.c = c;
    b.title = c === 0 ? 'Default' : 'Colour ' + c;
    b.onclick = ev => {
      ev.stopPropagation();
      selNodes().forEach(n => { if (c === 0) delete n.color; else n.color = String(c); });
      markDirty(); renderGroups(); renderNodes();
    };
    p.append(b);
  });
}

function positionPalette(){
  const p = $('palette');
  const ns = selNodes();
  if (!ns.length || (drag && drag.kind === 'marquee')){ p.hidden = true; return; }
  buildPalette();
  p.hidden = false;
  const grp = $('palGroup');
  if (grp) grp.hidden = ns.filter(n => n.type !== 'group').length < 2;

  /* sit above the bounding box of everything currently selected */
  let x0 = Infinity, y0 = Infinity, anyGroup = false;
  ns.forEach(n => {
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
    if (n.type === 'group') anyGroup = true;
  });
  const v = state.view;
  /* Groups carry a label above their top edge, so lift the bar clear of it. */
  const lift = anyGroup ? 74 : 44;
  p.style.left = (x0 * v.z + v.x) + 'px';
  p.style.top  = (y0 * v.z + v.y - lift) + 'px';
}

/* Wrap everything selected in a new group, the Obsidian way. */
function groupSelection(){
  const ns = selNodes().filter(n => n.type !== 'group');
  if (ns.length < 2){ toast('Select two or more cards to group them.', true); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  ns.forEach(n => {
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x + n.width); y1 = Math.max(y1, n.y + n.height);
  });
  const pad = 36;
  const g = {
    id: uid(), type: 'group', label: 'Group',
    x: Math.round(x0 - pad), y: Math.round(y0 - pad),
    width: Math.round(x1 - x0 + pad * 2), height: Math.round(y1 - y0 + pad * 2)
  };
  cur().nodes.unshift(g);
  selectOnly(g.id);
  markDirty();
  render();
  toast('Grouped ' + ns.length + ' cards.');
}

/* ===================================================================
   MUTATIONS
   =================================================================== */
function addNode(wx, wy, text, opts){
  opts = opts || {};
  const w = opts.width || 220, h = opts.height || 90;
  const n = {
    id: uid(), type: opts.type || 'text',
    x: Math.round(wx - w / 2), y: Math.round(wy - h / 2),
    width: w, height: h
  };
  if (n.type === 'link') n.url = opts.url || '';
  else if (n.type === 'group') n.label = opts.label || 'Group';
  else n.text = text || '';
  cur().nodes.push(n);
  selectOnly(n.id);
  markDirty();
  render();
  return n;
}
function deleteSelection(){
  const c = cur();
  if (state.sel.edge){
    c.edges = c.edges.filter(e => e.id !== state.sel.edge);
  } else if (state.sel.ids.length){
    const ids = state.sel.ids;
    c.nodes = c.nodes.filter(n => ids.indexOf(n.id) === -1);
    c.edges = c.edges.filter(e => ids.indexOf(e.fromNode) === -1 && ids.indexOf(e.toNode) === -1);
  } else return;
  clearSel();
  markDirty();
  render();
}
function switchTab(name){
  state.tab = name;
  clearSel();
  render();
  zoomToFit();
}
function beginEdit(nodeEl, n){
  /* Image cards have no text to edit — offer the URL instead. */
  if (n.type === 'link'){
    const url = prompt('Image URL', n.url || '');
    if (url !== null && url.trim() !== n.url){ n.url = url.trim(); markDirty(); render(); }
    return;
  }
  if (nodeEl.classList.contains('editing')) return;
  nodeEl.classList.add('editing');
  const body = nodeEl.querySelector('.body');
  const ta = document.createElement('textarea');
  ta.value = n.text || '';
  body.replaceWith(ta);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  const commit = () => {
    if (n.text !== ta.value){ n.text = ta.value; markDirty(); }
    render();
  };
  ta.addEventListener('blur', commit);
  ta.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Escape'){ ta.value = n.text || ''; ta.blur(); }
    if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) ta.blur();
  });
}

/* ===================================================================
   POINTER INTERACTION
   =================================================================== */
let drag = null;

$('viewport').addEventListener('pointerdown', ev => {
  if (ev.button !== 0 && ev.button !== 1 && ev.button !== 2) return;

  /* ---- groups first: only their label and corner are grabbable ---- */
  const groupEl = ev.target.closest('.group');
  if (groupEl){
    const g = nodeById(groupEl.dataset.id);
    if (g && ev.target.closest('.ggrip')){
      ev.preventDefault(); ev.stopPropagation();
      if (!isSel(g.id)) selectOnly(g.id);
      drag = { kind:'gresize', id:g.id, ox:ev.clientX, oy:ev.clientY, w0:g.width, h0:g.height };
      render();
      $('viewport').setPointerCapture(ev.pointerId);
      return;
    }
    if (g && ev.target.closest('.glabel')){
      ev.preventDefault(); ev.stopPropagation();
      if (!isSel(g.id)) { if (ev.shiftKey) toggleSel(g.id); else selectOnly(g.id); }
      /* Snapshot membership at grab time so cards can't join mid-drag. */
      const kids = containedNodes(g).map(n => ({ id:n.id, x0:n.x, y0:n.y }));
      drag = { kind:'gmove', id:g.id, ox:ev.clientX, oy:ev.clientY,
               x0:g.x, y0:g.y, kids:kids, moved:false };
      render();
      $('viewport').setPointerCapture(ev.pointerId);
      return;
    }
  }

  const anchorEl = ev.target.closest('.anchor');
  const gripEl   = ev.target.closest('.grip');
  const nodeEl   = ev.target.closest('.node');
  const hitEl    = ev.target.closest('path.hit');

  /* start a connection */
  if (anchorEl && nodeEl){
    ev.preventDefault(); ev.stopPropagation();
    const n = nodeById(nodeEl.dataset.id);
    drag = { kind:'link', from:n.id, side:anchorEl.dataset.side, preview:null };
    $('viewport').classList.add('connecting');
    $('viewport').setPointerCapture(ev.pointerId);
    return;
  }

  /* resize */
  if (gripEl && nodeEl){
    ev.preventDefault(); ev.stopPropagation();
    const n = nodeById(nodeEl.dataset.id);
    drag = { kind:'resize', id:n.id, ox:ev.clientX, oy:ev.clientY, w0:n.width, h0:n.height };
    if (!isSel(n.id)) selectOnly(n.id);
    renderNodes(); positionPalette();
    $('viewport').setPointerCapture(ev.pointerId);
    return;
  }

  /* move a node — and everything else that is selected with it */
  if (nodeEl){
    const n = nodeById(nodeEl.dataset.id);
    if (!n) return;
    if (ev.shiftKey) toggleSel(n.id);
    else if (!isSel(n.id)) selectOnly(n.id);

    if (!nodeEl.classList.contains('editing') && isSel(n.id)){
      ev.preventDefault();
      drag = { kind:'move', ox:ev.clientX, oy:ev.clientY, kids:movingSet(), moved:false };
      $('viewport').setPointerCapture(ev.pointerId);
    }
    render();
    return;
  }

  /* select an edge */
  if (hitEl){
    state.sel = { ids: [], edge: hitEl.dataset.edge };
    render();
    return;
  }

  /* empty canvas: middle button or held Space pans, anything else rubber-bands */
  ev.preventDefault();
  if (ev.button === 1 || spaceHeld){
    drag = { kind:'pan', ox:ev.clientX, oy:ev.clientY, vx:state.view.x, vy:state.view.y };
    $('viewport').classList.add('panning');
  } else {
    if (!ev.shiftKey) clearSel();
    const w = toWorld(ev.clientX, ev.clientY);
    drag = { kind:'marquee', x0:w.x, y0:w.y, sx:ev.clientX, sy:ev.clientY,
             base: ev.shiftKey ? state.sel.ids.slice() : [] };
    $('marquee').hidden = false;
    $('marquee').style.width = '0px';
    $('marquee').style.height = '0px';
  }
  $('viewport').setPointerCapture(ev.pointerId);
  render();
});

/* Everything that should travel with a drag: the selection, plus the
   contents of any selected group. */
function movingSet(){
  const kids = selNodes().map(m => ({ id:m.id, x0:m.x, y0:m.y }));
  selNodes().filter(m => m.type === 'group').forEach(g => {
    containedNodes(g).forEach(k => {
      if (!kids.some(z => z.id === k.id)) kids.push({ id:k.id, x0:k.x, y0:k.y });
    });
  });
  return kids;
}

$('viewport').addEventListener('pointermove', ev => {
  if (!drag) return;
  if (drag.kind === 'pan'){
    state.view.x = drag.vx + (ev.clientX - drag.ox);
    state.view.y = drag.vy + (ev.clientY - drag.oy);
    applyView();
  } else if (drag.kind === 'move'){
    const dx = (ev.clientX - drag.ox) / state.view.z;
    const dy = (ev.clientY - drag.oy) / state.view.z;
    drag.kids.forEach(k => {
      const n = nodeById(k.id);
      if (n){ n.x = Math.round(k.x0 + dx); n.y = Math.round(k.y0 + dy); }
    });
    drag.moved = true;
    renderGroups(); renderNodes(); renderEdges(); positionPalette();
  } else if (drag.kind === 'marquee'){
    const w = toWorld(ev.clientX, ev.clientY);
    const r = $('viewport').getBoundingClientRect();
    const m = $('marquee');
    m.style.left   = (Math.min(drag.sx, ev.clientX) - r.left) + 'px';
    m.style.top    = (Math.min(drag.sy, ev.clientY) - r.top) + 'px';
    m.style.width  = Math.abs(ev.clientX - drag.sx) + 'px';
    m.style.height = Math.abs(ev.clientY - drag.sy) + 'px';

    /* anything the box touches counts, same as Obsidian */
    const x0 = Math.min(drag.x0, w.x), x1 = Math.max(drag.x0, w.x);
    const y0 = Math.min(drag.y0, w.y), y1 = Math.max(drag.y0, w.y);
    const hit = cur().nodes
      .filter(n => n.x < x1 && n.x + n.width > x0 && n.y < y1 && n.y + n.height > y0)
      .map(n => n.id);
    state.sel = {
      ids: drag.base.concat(hit.filter(id => drag.base.indexOf(id) === -1)),
      edge: null
    };
    renderGroups(); renderNodes(); renderEdges();
  } else if (drag.kind === 'resize'){
    const n = nodeById(drag.id); if (!n) return;
    n.width  = Math.max(120, Math.round(drag.w0 + (ev.clientX - drag.ox) / state.view.z));
    n.height = Math.max(60,  Math.round(drag.h0 + (ev.clientY - drag.oy) / state.view.z));
    const el = $('nodes').querySelector('[data-id="' + n.id + '"]');
    if (el){ el.style.width = n.width + 'px'; el.style.height = n.height + 'px'; }
    renderEdges();
  } else if (drag.kind === 'gmove'){
    const g = nodeById(drag.id); if (!g) return;
    const dx = (ev.clientX - drag.ox) / state.view.z;
    const dy = (ev.clientY - drag.oy) / state.view.z;
    g.x = Math.round(drag.x0 + dx);
    g.y = Math.round(drag.y0 + dy);
    drag.kids.forEach(k => {
      const n = nodeById(k.id);
      if (n){ n.x = Math.round(k.x0 + dx); n.y = Math.round(k.y0 + dy); }
    });
    drag.moved = true;
    renderGroups(); renderNodes(); renderEdges(); positionPalette();
  } else if (drag.kind === 'gresize'){
    const g = nodeById(drag.id); if (!g) return;
    g.width  = Math.max(180, Math.round(drag.w0 + (ev.clientX - drag.ox) / state.view.z));
    g.height = Math.max(130, Math.round(drag.h0 + (ev.clientY - drag.oy) / state.view.z));
    renderGroups(); positionPalette();
  } else if (drag.kind === 'link'){
    const a = nodeById(drag.from); if (!a) return;
    const p1 = anchorPoint(a, drag.side);
    const w = toWorld(ev.clientX, ev.clientY);
    const over = document.elementFromPoint(ev.clientX, ev.clientY);
    const overNode = over && over.closest ? over.closest('.node') : null;
    let p2 = w, s2 = bestSide({ x:w.x, y:w.y, width:1, height:1 }, p1);
    if (overNode && overNode.dataset.id !== drag.from){
      const b = nodeById(overNode.dataset.id);
      if (b){ s2 = bestSide(b, p1); p2 = anchorPoint(b, s2); }
    }
    drag.preview = bezier(p1, drag.side, p2, s2);
    renderEdges();
  }
});

function endDrag(ev){
  if (!drag) return;
  if (drag.kind === 'link'){
    const over = document.elementFromPoint(ev.clientX, ev.clientY);
    const overNode = over && over.closest ? over.closest('.node') : null;
    if (overNode && overNode.dataset.id !== drag.from){
      const a = nodeById(drag.from), b = nodeById(overNode.dataset.id);
      if (a && b){
        const exists = cur().edges.some(e =>
          e.fromNode === a.id && e.toNode === b.id && e.fromSide === drag.side);
        if (!exists){
          cur().edges.push({
            id: uid(), fromNode: a.id, fromSide: drag.side,
            toNode: b.id, toSide: bestSide(b, anchorPoint(a, drag.side))
          });
          markDirty();
        }
      }
    }
  } else if (drag.kind === 'move' && drag.moved){
    markDirty();
  } else if (drag.kind === 'gmove' && drag.moved){
    markDirty();
  } else if (drag.kind === 'resize' || drag.kind === 'gresize'){
    markDirty();
  }
  const wasMarquee = drag.kind === 'marquee';
  drag = null;
  $('marquee').hidden = true;
  $('viewport').classList.remove('panning', 'connecting');
  render();
  if (wasMarquee && state.sel.ids.length > 1){
    toast(state.sel.ids.length + ' selected — drag to move together, or group them.');
  }
}
$('viewport').addEventListener('pointerup', endDrag);
$('viewport').addEventListener('pointercancel', endDrag);

$('viewport').addEventListener('dblclick', ev => {
  const labelEl = ev.target.closest('.glabel');
  if (labelEl){
    const g = nodeById(labelEl.parentElement.dataset.id);
    if (g) renameGroup(labelEl, g);
    return;
  }
  const nodeEl = ev.target.closest('.node');
  if (nodeEl){
    const n = nodeById(nodeEl.dataset.id);
    if (n) beginEdit(nodeEl, n);
    return;
  }
  const w = toWorld(ev.clientX, ev.clientY);
  const n = addNode(w.x, w.y, '');
  const el = $('nodes').querySelector('[data-id="' + n.id + '"]');
  if (el) beginEdit(el, n);
});

$('viewport').addEventListener('wheel', ev => {
  ev.preventDefault();
  zoomAt(ev.clientX, ev.clientY, ev.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

/* Right-drag rubber-bands, so the browser menu has to stay out of the way. */
$('viewport').addEventListener('contextmenu', ev => ev.preventDefault());

document.addEventListener('keydown', ev => {
  if ($('shell').hidden) return;
  const t = ev.target.tagName;
  if (t === 'TEXTAREA' || t === 'INPUT') return;
  if (ev.code === 'Space' && !ev.repeat){ spaceHeld = true; ev.preventDefault(); }
  if (ev.key === 'Delete' || ev.key === 'Backspace'){ ev.preventDefault(); deleteSelection(); }
  if (ev.key === 'Escape'){ clearSel(); render(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'a'){ ev.preventDefault(); selectAll(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'g'){ ev.preventDefault(); groupSelection(); }
});
document.addEventListener('keyup', ev => { if (ev.code === 'Space') spaceHeld = false; });
window.addEventListener('blur', () => { spaceHeld = false; });

/* ===================================================================
   PERSISTENCE
   =================================================================== */
function serialize(){
  return JSON.stringify({ version: 1, client: state.client, tabs: state.tabs });
}
function hydrate(text){
  let d = null;
  try { d = JSON.parse(text); } catch (e) {}
  state.tabs = blankTabs();
  if (d && d.tabs){
    TABS.forEach(name => {
      const t = d.tabs[name];
      if (t && Array.isArray(t.nodes)) state.tabs[name] = { nodes: t.nodes, edges: t.edges || [] };
    });
  }
  state.client = (d && d.client) || 'XYZ';
  $('clientName').value = state.client;
}

async function refreshBoards(){
  const { data, error } = await sb.from('reports')
    .select('id,title,updated_at').order('updated_at', { ascending: false });
  if (error){ toast('Could not list boards: ' + error.message, true); return; }
  state.boards = data || [];
  const sel = $('boardPicker');
  sel.innerHTML = '';
  if (!state.boardId){
    const o = document.createElement('option');
    o.value = ''; o.textContent = '(unsaved board)';
    sel.append(o);
  }
  state.boards.forEach(b => {
    const o = document.createElement('option');
    o.value = b.id; o.textContent = b.title;
    if (b.id === state.boardId) o.selected = true;
    sel.append(o);
  });
}

async function openBoard(id){
  const { data, error } = await sb.from('reports').select('id,title,body').eq('id', id).single();
  if (error){ toast('Could not open board: ' + error.message, true); return; }
  state.boardId = data.id;
  hydrate(data.body || '');
  state.tab = TABS[0];
  clearSel();
  state.dirty = false;
  $('saveState').textContent = 'Saved';
  $('saveState').className = 'save-state';
  await refreshBoards();
  render();
  zoomToFit();
}

async function saveBoard(quiet){
  if (!state.user) return;
  const el = $('saveState');
  el.textContent = 'Saving…'; el.className = 'save-state';
  const payload = { title: state.client + ' Strategy Board', body: serialize() };

  let error;
  if (state.boardId){
    ({ error } = await sb.from('reports').update(payload).eq('id', state.boardId));
  } else {
    payload.owner_id = state.user.id;
    const res = await sb.from('reports').insert(payload).select('id').single();
    error = res.error;
    if (!error) state.boardId = res.data.id;
  }
  if (error){
    el.textContent = 'Save failed'; el.className = 'save-state bad';
    toast('Save failed: ' + error.message, true);
    return;
  }
  state.dirty = false;
  el.textContent = 'Saved'; el.className = 'save-state';
  await refreshBoards();
  if (!quiet) toast('Board saved.');
}

function newBoard(){
  state.boardId = null;
  state.client = 'New client';
  state.tabs = blankTabs();
  state.tab = TABS[0];
  clearSel();
  $('clientName').value = state.client;
  markDirty();
  render();
  zoomToFit();
  toast('New board started — press Save to keep it.');
}

/* ===================================================================
   AUTH
   =================================================================== */
async function onCredential(response){
  if (!sb){ gateMessage('The database client did not load. Reload and try again.'); return; }
  try {
    const { data, error } = await sb.auth.signInWithIdToken({
      provider: 'google', token: response.credential
    });
    if (error){ gateMessage('Sign-in failed: ' + error.message); return; }
    if (!isAllowed(data.user.email)){
      await sb.auth.signOut();
      gateMessage(data.user.email + ' is not on the access list for this board.');
      return;
    }
    await enterApp(data.user);
  } catch (e){
    gateMessage('Sign-in failed: ' + (e && e.message ? e.message : String(e)));
  }
}

async function enterApp(user){
  state.user = user;
  const m = user.user_metadata || {};
  $('gate').hidden = true;
  $('shell').hidden = false;
  $('userName').textContent = m.full_name || m.name || user.email || '';
  $('userMail').textContent = user.email || '';
  const pic = m.avatar_url || m.picture;
  if (pic) $('userPic').src = pic; else $('userPic').hidden = true;

  await refreshBoards();
  if (state.boards.length){
    await openBoard(state.boards[0].id);
  } else {
    state.tabs = blankTabs();
    render();
    zoomToFit();
    toast('No boards yet — add notes, then press Save.');
  }
}

async function signOut(){
  if (state.dirty && !confirm('You have unsaved changes. Sign out anyway?')) return;
  if (sb) await sb.auth.signOut();
  if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  location.reload();
}

/* ===================================================================
   WIRING
   =================================================================== */
function addAtCentre(opts){
  const r = $('viewport').getBoundingClientRect();
  const w = toWorld(r.left + r.width / 2, r.top + r.height / 2);
  return addNode(w.x, w.y, '', opts);
}
function addAndEdit(opts){
  const n = addAtCentre(opts);
  const el = $('nodes').querySelector('[data-id="' + n.id + '"]');
  if (el) beginEdit(el, n);
}
$('dockCard').onclick  = () => addAndEdit();
$('dockText').onclick  = () => addAndEdit({ width: 300, height: 180 });
$('dockMedia').onclick = () => {
  const url = prompt('Image URL');
  if (!url || !url.trim()) return;
  addAtCentre({ type: 'link', url: url.trim(), width: 320, height: 200 });
};
$('dockGroup').onclick = () => {
  const g = addAtCentre({ type: 'group', width: 460, height: 320 });
  g.label = 'Group';
  render();
  toast('Group added — drag cards into it, then drag its label to move them together.');
};
/* the dock sits inside the viewport, so stop clicks becoming pans */
$('dock').addEventListener('pointerdown', e => e.stopPropagation());
$('btnZoomIn').onclick = () => {
  const r = $('viewport').getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.2);
};
$('btnZoomOut').onclick = () => {
  const r = $('viewport').getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.2);
};
$('btnFit').onclick = zoomToFit;
$('btnSave').onclick = () => saveBoard(false);
$('btnNewBoard').onclick = newBoard;
$('btnSignOut').onclick = signOut;
$('boardPicker').onchange = e => { if (e.target.value) openBoard(e.target.value); };
$('clientName').oninput = e => { state.client = e.target.value.trim() || 'Untitled'; markDirty(); };
$('palette').addEventListener('pointerdown', e => e.stopPropagation());
window.addEventListener('resize', () => { applyView(); });
window.addEventListener('beforeunload', e => { if (state.dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ===================================================================
   BOOT
   =================================================================== */
const BLOCKED_MSG =
  'Google sign-in did not load. This is nearly always an ad blocker or privacy ' +
  'extension blocking accounts.google.com. Allow this site in that extension, or ' +
  'open the page in an Incognito window to confirm.';

window.onGsiLoad = function(){
  if (!(window.google && google.accounts && google.accounts.id)){ gateMessage(BLOCKED_MSG); return; }
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential });
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  google.accounts.id.renderButton($('gsiButton'), {
    theme: dark ? 'filled_black' : 'outline',
    size: 'large', text: 'signin_with', shape: 'pill', width: 280
  });
};
window.onGsiError = function(){ gateMessage(BLOCKED_MSG); };
setTimeout(function(){
  if (!$('gate').hidden && !(window.google && google.accounts && google.accounts.id)) gateMessage(BLOCKED_MSG);
}, 5000);

state.tabs = blankTabs();
render();

(function boot(){
  if (!(window.supabase && window.supabase.createClient)){
    gateMessage('The Supabase library failed to load. Check your connection and reload.');
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.getSession().then(({ data }) => {
    const u = data && data.session && data.session.user;
    if (u && isAllowed(u.email)) enterApp(u);
  });
})();
</script>

<script src="https://accounts.google.com/gsi/client"
        onload="window.onGsiLoad && window.onGsiLoad()"
        onerror="window.onGsiError && window.onGsiError()"
        async defer></script>
</body>
